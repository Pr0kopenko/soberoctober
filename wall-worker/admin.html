<!doctype html><html lang="ru"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Модерация — Sober October</title><style>body{background:#f7f6fc;color:#29233f;font:16px Arial;max-width:900px;margin:40px auto;padding:20px}h1{font-size:40px}button,input{font:inherit;padding:12px;border:1px solid #dad6e8;border-radius:9px}button{cursor:pointer;margin:5px}input{width:min(500px,90%)}article{padding:20px;background:#fff;border-radius:20px;margin:20px 0}article p{white-space:pre-wrap;line-height:1.5}small{color:#696477;overflow-wrap:anywhere}.approve{background:#d3eddf}.reject{background:#ffcfbf}#status{min-height:24px}.bar{display:flex;gap:10px;flex-wrap:wrap}[hidden]{display:none!important}</style><h1>Стена радостей.<br>Сначала — ваше «да».</h1><p>Одобряйте только анонимные доброжелательные записи без личных данных, медицинских советов, рекламы и ссылок. Отклонение убирает запись с публичной стены.</p><form id="login"><label>Ключ модератора<br><input type="password" id="token" required autocomplete="off" minlength="32"></label><button>Открыть очередь</button></form><p id="status" role="status"></p><div id="tools" hidden class="bar"><button id="refresh">Обновить</button><button id="logout">Выйти</button><label>Показать <select id="filter"><option value="pending">На проверке</option><option value="approved">Опубликованные</option><option value="rejected">Отклонённые</option></select></label></div><div id="reports"></div><div id="posts"></div><script>
let token='',items=[];const $=s=>document.querySelector(s),esc=v=>String(v).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;');
async function api(path,options={}){const r=await fetch(path,{...options,headers:{'Content-Type':'application/json','Authorization':'Bearer '+token}});const data=await r.json();if(!r.ok)throw Error(data.error||'Ошибка');return data;}
function render(){const list=items.filter(p=>p.status===$('#filter').value);$('#posts').innerHTML=list.length?list.map(p=>`<article><small>№${esc(p.id)} · ${esc(p.created_at)} · ${esc(p.status)}</small><p>${esc(p.text)}</p><button class="approve" data-id="${esc(p.id)}" data-status="approved">Опубликовать</button><button class="reject" data-id="${esc(p.id)}" data-status="rejected">Отклонить / скрыть</button></article>`).join(''):'<p>Здесь пока нет записей.</p>';}
async function refresh(){try{const data=await api('/admin/posts');items=data.posts;render();$('#reports').innerHTML=data.reports.length?'<h2>Обращения</h2>'+data.reports.map(r=>`<article><small>Запись №${esc(r.post_id)}</small><p>${esc(r.reason)}</p><button class="reject" data-id="${esc(r.post_id)}" data-status="rejected">Скрыть запись</button></article>`).join(''):'';$('#tools').hidden=false;$('#login').hidden=true;$('#token').value='';$('#status').textContent='Очередь загружена. Ключ хранится только в памяти этой вкладки.';}catch(e){$('#status').textContent=e.message;}}
$('#login').onsubmit=e=>{e.preventDefault();token=$('#token').value;refresh();};$('#refresh').onclick=refresh;$('#filter').onchange=render;$('#logout').onclick=()=>{token='';items=[];$('#posts').innerHTML='';$('#reports').innerHTML='';$('#tools').hidden=true;$('#login').hidden=false;$('#status').textContent='Вы вышли.';};document.addEventListener('click',async e=>{const b=e.target.closest('[data-id]');if(!b)return;b.disabled=true;try{await api('/admin/posts/'+b.dataset.id,{method:'PATCH',body:JSON.stringify({status:b.dataset.status})});await refresh();$('#status').textContent=b.dataset.status==='approved'?'Запись опубликована.':'Запись скрыта.';}catch(e){$('#status').textContent=e.message;}finally{b.disabled=false;}});
</script></html>
